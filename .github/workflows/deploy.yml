name: Build & deploy (konx-api)

# Push sur main -> build image -> push GHCR -> bump du tag dans argocd-apps
# (ArgoCD auto-sync ensuite). Même pattern que les autres services du foyer.

on:
  push:
    branches: [main]
    paths: ['main.py', 'Dockerfile', '.github/workflows/deploy.yml']

concurrency:
  group: deploy-konx-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/john6810/konx-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest

      - name: Bump image tag dans argocd-apps
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          set -e
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/John6810/argocd-apps.git" gitops
          cd gitops
          sed -i "s|image: ghcr.io/john6810/konx-api:.*|image: ghcr.io/john6810/konx-api:sha-${{ steps.sha.outputs.short }}|" apps/konx-api/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/konx-api/deployment.yaml
          git commit -m "chore(konx-api): image sha-${{ steps.sha.outputs.short }}" || echo "aucun changement"
          git push
